<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HORIZONS — Hand-Drawn Graphite Launch Film</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141312;
      color: #E8E3D7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }
    #wrapper {
      position: relative;
      width: min(96vw, 1280px);
      aspect-ratio: 16 / 9;
      background: #0D0D0E;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
      border-radius: 6px;
      overflow: hidden;
    }
    canvas#mainCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      width: min(96vw, 1280px);
      background: #1E1D1B;
      padding: 12px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }
    button {
      background: #2C2A28;
      color: #F5F2EB;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #3A3835;
      border-color: rgba(255,255,255,0.3);
    }
    input[type=range] {
      flex: 1;
      accent-color: #C26D53;
      cursor: pointer;
    }
    .telemetry {
      font-family: "JetBrains Mono", monospace;
      color: #A09B90;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <canvas id="mainCanvas" width="1920" height="1080"></canvas>
  </div>

  <div class="controls">
    <button id="playBtn">PLAY</button>
    <input type="range" id="scrubber" min="0" max="479" value="0">
    <span class="telemetry" id="timeCode">00:00 / 00:20 (FRAME 000/480)</span>
  </div>

  <script>
  'use strict';

  // ==========================================
  // CONFIGURATION & CONSTANTS
  // ==========================================
  const W = 1920;
  const H = 1080;
  const FPS = 24;
  const TOTAL_FRAMES = 480; // 20.0 seconds
  const DURATION = TOTAL_FRAMES / FPS;

  window.__NDRAW = TOTAL_FRAMES;
  window.__fps = FPS;
  window.__size = { w: W, h: H };
  window.__ready = true;

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  // Palette Definitions
  const PAL = {
    paperBase: '#F5F2EB',       // 640gsm Cold-Press Cotton Rag
    paperShadow: '#E8E3D7',     // Fiber density shading
    draftGrid: 'rgba(213, 207, 194, 0.45)', // 2H faint technical grid
    pencil2H: 'rgba(74, 71, 67, 0.28)',    // 2H contour whisper
    pencil4B: '#4A4743',        // 4B flat midtone
    pencil8B: '#1A1918',        // 8B greasy velvet carbon mass
    slateAbyss: '#0D0D0E',      // Obsidian slate
    silverDust: '#7E8084',      // Crushed graphite haze
    chalkHighlight: '#E8EAED',  // Luminous white chalk
    terracottaHanko: '#C26D53', // Vermillion artist seal
    ochreAccent: '#B5884B'      // Warm architectural ochre
  };

  // Pre-generate static paper grain texture
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 512;
  grainCanvas.height = 512;
  const gctx = grainCanvas.getContext('2d');
  const imgData = gctx.createImageData(512, 512);
  const data = imgData.data;
  let seed = 42;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  for (let i = 0; i < data.length; i += 4) {
    const v = 245 + (rnd() * 10 - 5);
    const noise = (rnd() - 0.5) * 16;
    data[i] = Math.min(255, Math.max(0, v + noise));
    data[i+1] = Math.min(255, Math.max(0, v - 3 + noise));
    data[i+2] = Math.min(255, Math.max(0, v - 10 + noise));
    data[i+3] = 255;
  }
  gctx.putImageData(imgData, 0, 0);

  // Math & Easing Helpers (GSAP & Motion equivalents)
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutQuad(t) { return t * (2 - t); }
  function easeOutCubic(t) { return (--t) * t * t + 1; }
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
  function springSettle(t, stiffness = 120, damping = 14) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const omega = Math.sqrt(stiffness);
    return 1 - Math.exp(-damping * t * 0.5) * Math.cos(omega * t);
  }

  // Draw hand-drawn stroke with organic graphite jitter
  function drawGraphiteStroke(c, points, color, width, opacity = 1.0, jitterAmp = 1.2) {
    if (points.length < 2) return;
    c.save();
    c.strokeStyle = color;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.globalAlpha = opacity;
    c.beginPath();
    c.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      const p = points[i];
      const jx = (rnd() - 0.5) * jitterAmp;
      const jy = (rnd() - 0.5) * jitterAmp;
      c.lineTo(p[0] + jx, p[1] + jy);
    }
    c.stroke();
    c.restore();
  }

  // Directional cross-hatch fill simulator
  function drawCrossHatch(c, x, y, w, h, density = 0.5, angle = -Math.PI / 4, color = PAL.pencil4B, width = 1.0, alpha = 0.4) {
    c.save();
    c.beginPath();
    c.rect(x, y, w, h);
    c.clip();
    c.strokeStyle = color;
    c.lineWidth = width;
    c.globalAlpha = alpha;
    const step = 8 / density;
    const diag = Math.hypot(w, h);
    c.translate(x + w / 2, y + h / 2);
    c.rotate(angle);
    c.beginPath();
    for (let i = -diag; i <= diag; i += step) {
      c.moveTo(i, -diag);
      c.lineTo(i + (rnd() - 0.5) * 2, diag);
    }
    c.stroke();
    c.restore();
  }

  // ==========================================
  // MASTER RENDER SCENE FUNCTION
  // ==========================================
  function renderFrame(targetCtx, frameIndex) {
    const t = frameIndex / FPS; // time in seconds (0.0 to 20.0)
    seed = (frameIndex * 997 + 101) % 2147483647;

    // Background paper substrate
    targetCtx.fillStyle = PAL.paperBase;
    targetCtx.fillRect(0, 0, W, H);
    targetCtx.drawImage(grainCanvas, 0, 0, W, H);

    // Camera Drift (Subtle Steadicam float)
    targetCtx.save();
    const camDriftX = Math.sin(t * 0.4) * 8;
    const camDriftY = Math.cos(t * 0.3) * 6;
    const camScale = 1.0 + Math.sin(t * 0.2) * 0.015;
    targetCtx.translate(W / 2, H / 2);
    targetCtx.scale(camScale, camScale);
    targetCtx.translate(-W / 2 + camDriftX, -H / 2 + camDriftY);

    // ----------------------------------------------------
    // BEAT 1: The Blank Sheet & 2H Contour Wireframe (0.0s - 3.5s)
    // ----------------------------------------------------
    if (t < 4.0) {
      const beat1Progress = clamp(t / 3.2, 0, 1);
      const ease1 = easeOutCubic(beat1Progress);

      // Faint 2H Technical Drafting Grid
      targetCtx.strokeStyle = PAL.draftGrid;
      targetCtx.lineWidth = 1;
      const gridSize = 60;
      targetCtx.beginPath();
      for (let x = 0; x < W; x += gridSize) {
        targetCtx.moveTo(x, 0); targetCtx.lineTo(x, H);
      }
      for (let y = 0; y < H; y += gridSize) {
        targetCtx.moveTo(0, y); targetCtx.lineTo(W, y);
      }
      targetCtx.stroke();

      // Technical Telemetry Annotations
      targetCtx.fillStyle = 'rgba(74, 71, 67, 0.45)';
      targetCtx.font = '12px "JetBrains Mono", monospace';
      targetCtx.fillText('FIG. 01 — ARCHITECTURAL ARCH / LAT. 35.0116° N / 640GSM COTTON', 90, 80);
      targetCtx.fillText('SCALE: 1:1 MONOGRAPH / BEAT: CONTOUR DISCOVERY', 90, 102);

      // 2H Contour Wireframe Architecture
      const archCenterX = W / 2;
      const archCenterY = 560;
      const archRadius = 240;

      // Draw arch outline progressively
      targetCtx.save();
      targetCtx.strokeStyle = PAL.pencil2H;
      targetCtx.lineWidth = 2.0;
      targetCtx.beginPath();
      targetCtx.arc(archCenterX, archCenterY, archRadius, Math.PI, Math.PI + Math.PI * ease1, false);
      targetCtx.stroke();

      // Inner arch
      targetCtx.beginPath();
      targetCtx.arc(archCenterX, archCenterY, archRadius * 0.75, Math.PI, Math.PI + Math.PI * ease1, false);
      targetCtx.stroke();

      // Horizontal Baseline & Pillars
      if (ease1 > 0.4) {
        const pillarP = (ease1 - 0.4) / 0.6;
        targetCtx.beginPath();
        targetCtx.moveTo(archCenterX - archRadius, archCenterY);
        targetCtx.lineTo(archCenterX - archRadius, archCenterY + 220 * pillarP);
        targetCtx.moveTo(archCenterX + archRadius, archCenterY);
        targetCtx.lineTo(archCenterX + archRadius, archCenterY + 220 * pillarP);
        targetCtx.moveTo(archCenterX - archRadius * 0.75, archCenterY);
        targetCtx.lineTo(archCenterX - archRadius * 0.75, archCenterY + 220 * pillarP);
        targetCtx.moveTo(archCenterX + archRadius * 0.75, archCenterY);
        targetCtx.lineTo(archCenterX + archRadius * 0.75, archCenterY + 220 * pillarP);
        targetCtx.stroke();
      }

      // Rising Sun Rays
      if (ease1 > 0.6) {
        const rayP = (ease1 - 0.6) / 0.4;
        for (let a = 0; a < 7; a++) {
          const angle = Math.PI + (a + 1) * (Math.PI / 8);
          const r1 = archRadius * 0.82;
          const r2 = r1 + 50 * rayP;
          targetCtx.beginPath();
          targetCtx.moveTo(archCenterX + Math.cos(angle) * r1, archCenterY + Math.sin(angle) * r1);
          targetCtx.lineTo(archCenterX + Math.cos(angle) * r2, archCenterY + Math.sin(angle) * r2);
          targetCtx.stroke();
        }
      }
      targetCtx.restore();
    }

    // ----------------------------------------------------
    // BEAT 2: 4B Cross-Hatching & Volumetric Mass (3.5s - 7.5s)
    // ----------------------------------------------------
    if (t >= 3.0 && t < 7.8) {
      const beat2Progress = clamp((t - 3.2) / 3.8, 0, 1);
      const ease2 = easeOutCubic(beat2Progress);
      const archCenterX = W / 2;
      const archCenterY = 540;
      const archRadius = 240;

      // 4B Diagonal Cross-Hatching
      drawCrossHatch(targetCtx, archCenterX - archRadius, archCenterY - archRadius, archRadius * 2, archRadius + 220, 0.6 * ease2, -Math.PI / 4, PAL.pencil4B, 1.2, 0.35 * ease2);

      // Deep 8B Grease Carbon Mass inside arch
      if (ease2 > 0.3) {
        const shadowAlpha = clamp((ease2 - 0.3) / 0.7, 0, 0.85);
        targetCtx.save();
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.globalAlpha = shadowAlpha * 0.8;
        targetCtx.beginPath();
        targetCtx.arc(archCenterX, archCenterY, archRadius * 0.75, Math.PI, 0, false);
        targetCtx.lineTo(archCenterX + archRadius * 0.75, archCenterY + 220);
        targetCtx.lineTo(archCenterX - archRadius * 0.75, archCenterY + 220);
        targetCtx.closePath();
        targetCtx.fill();
        targetCtx.restore();
      }

      // Strong contour strokes
      targetCtx.save();
      targetCtx.strokeStyle = PAL.pencil8B;
      targetCtx.lineWidth = 3.5;
      targetCtx.beginPath();
      targetCtx.arc(archCenterX, archCenterY, archRadius, Math.PI, 0, false);
      targetCtx.lineTo(archCenterX + archRadius, archCenterY + 220);
      targetCtx.moveTo(archCenterX - archRadius, archCenterY);
      targetCtx.lineTo(archCenterX - archRadius, archCenterY + 220);
      targetCtx.stroke();
      targetCtx.restore();

      // Display Typography Rub-Down: HORIZONS
      if (t >= 4.2) {
        const typoP = clamp((t - 4.2) / 1.6, 0, 1);
        const springVal = springSettle(typoP, 140, 16);
        const typoY = 320 - (1 - springVal) * 25;

        targetCtx.save();
        targetCtx.textAlign = 'center';
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.globalAlpha = clamp(typoP * 1.5, 0, 1);

        // Editorial Serif Title
        targetCtx.font = 'italic 700 86px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('H O R I Z O N S', W / 2, typoY);

        // Subtitle
        targetCtx.font = '400 16px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.letterSpacing = '0.35em';
        targetCtx.fillText('WHERE STILLNESS MEETS THE HORIZON', W / 2, typoY + 54);

        // Badges
        if (typoP > 0.5) {
          targetCtx.font = '500 12px "JetBrains Mono", monospace';
          targetCtx.fillStyle = PAL.ochreAccent;
          targetCtx.fillText('MINDFUL STAYS · LIVING MONOGRAPHS · SLOW TIME', W / 2, typoY + 88);
        }
        targetCtx.restore();
      }
    }

    // ----------------------------------------------------
    // BEAT 3: Hand-Drawn Journey across 3 Cities (7.5s - 14.5s)
    // ----------------------------------------------------
    if (t >= 7.3 && t < 14.8) {
      // 3 Sub-chapters: Kyoto (7.5-9.8s), Oaxaca (9.8-12.1s), Bergen (12.1-14.5s)
      targetCtx.save();

      if (t < 9.9) {
        // --- CHAPTER 1: KYOTO (7.5s - 9.8s) ---
        const kp = clamp((t - 7.5) / 2.0, 0, 1);
        const kEase = easeOutCubic(kp);

        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 600 52px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('京都 · KYOTO', 180, 260);

        targetCtx.font = '400 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('CITADELS OF MINDFUL STILLNESS · CEDAR MACHIYA & MOSS TEMPLES', 180, 296);

        // Machiya wooden eave hand-drawn architecture
        targetCtx.strokeStyle = PAL.pencil8B;
        targetCtx.lineWidth = 3.0;
        targetCtx.beginPath();
        // Roof eave curve
        targetCtx.moveTo(180, 480);
        targetCtx.quadraticCurveTo(550, 420, 920 * kEase + 180 * (1 - kEase), 470);
        targetCtx.stroke();

        // Eave rafters
        targetCtx.lineWidth = 1.5;
        targetCtx.strokeStyle = PAL.pencil4B;
        for (let rx = 220; rx < 880; rx += 28) {
          if (rx < 180 + 740 * kEase) {
            targetCtx.beginPath();
            targetCtx.moveTo(rx, 465);
            targetCtx.lineTo(rx - 15, 520);
            targetCtx.stroke();
          }
        }

        // Bamboo Grove Stipple & Stalks
        targetCtx.strokeStyle = PAL.pencil4B;
        targetCtx.lineWidth = 4.0;
        for (let b = 0; b < 6; b++) {
          const bx = 1100 + b * 110;
          if (kEase > b * 0.15) {
            targetCtx.beginPath();
            targetCtx.moveTo(bx, 750);
            targetCtx.lineTo(bx + (rnd() - 0.5) * 8, 300);
            targetCtx.stroke();
            // Nodes
            targetCtx.lineWidth = 6.0;
            targetCtx.beginPath();
            targetCtx.moveTo(bx - 12, 440); targetCtx.lineTo(bx + 12, 440);
            targetCtx.moveTo(bx - 12, 580); targetCtx.lineTo(bx + 12, 580);
            targetCtx.stroke();
            targetCtx.lineWidth = 4.0;
          }
        }

        // Sumi-e Kasure Calligraphic Accent
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = '700 84px serif';
        targetCtx.globalAlpha = 0.85 * kEase;
        targetCtx.fillText('静', 1580, 420);
        targetCtx.font = '13px "JetBrains Mono", monospace';
        targetCtx.fillText('[ SEI — QUIETUDE ]', 1540, 460);
      }
      else if (t < 12.2) {
        // --- CHAPTER 2: OAXACA (9.8s - 12.1s) ---
        const op = clamp((t - 9.8) / 2.0, 0, 1);
        const oEase = easeOutCubic(op);

        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 600 52px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('OAXACA DE JUÁREZ', 180, 260);

        targetCtx.font = '400 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('EARTHEN SMOKE & COPAL RESIN · ARTISAN CLAY GUILDS', 180, 296);

        // Hand-drawn Terracotta Arch
        targetCtx.strokeStyle = PAL.terracottaHanko;
        targetCtx.lineWidth = 3.5;
        targetCtx.beginPath();
        targetCtx.arc(520, 560, 180, Math.PI, Math.PI + Math.PI * oEase, false);
        targetCtx.stroke();

        // Clay Comal & Copal Smoke Plume (Nijimi Bleed)
        targetCtx.strokeStyle = PAL.pencil8B;
        targetCtx.lineWidth = 3.0;
        targetCtx.beginPath();
        targetCtx.ellipse(1120, 620, 220 * oEase, 60 * oEase, 0, 0, Math.PI * 2);
        targetCtx.stroke();

        // Curling smoke plume
        targetCtx.save();
        targetCtx.strokeStyle = 'rgba(74, 71, 67, 0.4)';
        targetCtx.lineWidth = 4.0;
        targetCtx.beginPath();
        targetCtx.moveTo(1120, 600);
        targetCtx.bezierCurveTo(1080, 520, 1160, 440, 1100, 360 * (2 - oEase));
        targetCtx.stroke();
        targetCtx.restore();

        // Agave Specimen Sketch
        targetCtx.strokeStyle = PAL.pencil4B;
        targetCtx.lineWidth = 2.0;
        for (let l = -3; l <= 3; l++) {
          targetCtx.beginPath();
          targetCtx.moveTo(1560, 680);
          targetCtx.quadraticCurveTo(1560 + l * 45, 520, 1560 + l * 80 * oEase, 460);
          targetCtx.stroke();
        }
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.font = '12px "JetBrains Mono", monospace';
        targetCtx.fillText('SPECIMEN: AGAVE POTATORUM / CLAY KILN 980°C', 1380, 720);
      }
      else {
        // --- CHAPTER 3: BERGEN (12.1s - 14.5s) ---
        const bp = clamp((t - 12.1) / 2.0, 0, 1);
        const bEase = easeOutCubic(bp);

        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 600 52px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('BERGEN · HANSEATIC FJORD', 180, 260);

        targetCtx.font = '400 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('PINE TIMBER GABLES & MARITIME RAIN · 60.39° N', 180, 296);

        // Pointed Hanseatic Gables
        targetCtx.strokeStyle = PAL.pencil8B;
        targetCtx.lineWidth = 3.0;
        for (let g = 0; g < 4; g++) {
          const gx = 260 + g * 220;
          if (bEase > g * 0.2) {
            targetCtx.beginPath();
            targetCtx.moveTo(gx, 660);
            targetCtx.lineTo(gx, 480);
            targetCtx.lineTo(gx + 90, 360);
            targetCtx.lineTo(gx + 180, 480);
            targetCtx.lineTo(gx + 180, 660);
            targetCtx.closePath();
            targetCtx.stroke();
            // Timber cross beams
            drawCrossHatch(targetCtx, gx, 480, 180, 180, 0.4, -Math.PI / 4, PAL.pencil4B, 1.0, 0.25);
          }
        }

        // Fjord Mountain Ridges in Distance
        targetCtx.strokeStyle = PAL.pencil2H;
        targetCtx.lineWidth = 2.0;
        targetCtx.beginPath();
        targetCtx.moveTo(1100, 620);
        targetCtx.lineTo(1320, 380);
        targetCtx.lineTo(1540, 490);
        targetCtx.lineTo(1820, 320);
        targetCtx.stroke();

        // Vertical Rain Stipple
        targetCtx.strokeStyle = 'rgba(74, 71, 67, 0.3)';
        targetCtx.lineWidth = 1.2;
        for (let r = 0; r < 40; r++) {
          const rx = 1100 + rnd() * 700;
          const ry = 300 + rnd() * 350;
          targetCtx.beginPath();
          targetCtx.moveTo(rx, ry);
          targetCtx.lineTo(rx - 4, ry + 22);
          targetCtx.stroke();
        }
      }

      targetCtx.restore();
    }

    // ----------------------------------------------------
    // BEAT 4: Dynamic Slate Inversion (14.5s - 17.5s)
    // ----------------------------------------------------
    if (t >= 14.2 && t < 17.8) {
      const invP = clamp((t - 14.5) / 2.5, 0, 1);
      const invEase = easeInOutCubic(invP);

      // Inversion Wipe / Expanding Charcoal Blot
      const blotRadius = invEase * Math.hypot(W, H);
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.arc(W / 2, H / 2, blotRadius, 0, Math.PI * 2);
      targetCtx.fillStyle = PAL.slateAbyss;
      targetCtx.fill();
      targetCtx.clip();

      // Inside Slate Inversion: Silver Dust & Luminous Chalk
      targetCtx.fillStyle = PAL.chalkHighlight;
      targetCtx.font = 'italic 700 72px "Instrument Serif", Georgia, serif';
      targetCtx.textAlign = 'center';
      targetCtx.fillText('THE LIVING MONOGRAPH', W / 2, 280);

      targetCtx.font = '500 15px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.silverDust;
      targetCtx.fillText('REAL-TIME WEATHER GAUGES · CURATED RETREATS · 6 CITADELS', W / 2, 330);

      // Bento Telemetry Cards (Minimalist-UI + Neo-Minimal 3D Hybrid)
      const cards = [
        { city: 'KYOTO', temp: '18°C', desc: 'MOSS RAIN', pace: '0.4x' },
        { city: 'OAXACA', temp: '24°C', desc: 'COPAL EMBERS', pace: '0.5x' },
        { city: 'BERGEN', temp: '14°C', desc: 'FJORD MIST', pace: '0.3x' }
      ];

      for (let ci = 0; ci < cards.length; ci++) {
        const cx = W / 2 - 460 + ci * 320;
        const cy = 420;
        const c = cards[ci];

        targetCtx.strokeStyle = 'rgba(255,255,255,0.12)';
        targetCtx.lineWidth = 1;
        targetCtx.strokeRect(cx, cy, 280, 360);

        targetCtx.textAlign = 'left';
        targetCtx.font = '600 20px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.chalkHighlight;
        targetCtx.fillText(c.city, cx + 24, cy + 50);

        targetCtx.font = '300 48px "Instrument Serif", Georgia, serif';
        targetCtx.fillText(c.temp, cx + 24, cy + 120);

        targetCtx.font = '400 13px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.silverDust;
        targetCtx.fillText('ATMOSPHERE: ' + c.desc, cx + 24, cy + 170);
        targetCtx.fillText('TEMPO: ' + c.pace, cx + 24, cy + 200);

        // Circular Dial
        targetCtx.strokeStyle = PAL.terracottaHanko;
        targetCtx.lineWidth = 2;
        targetCtx.beginPath();
        targetCtx.arc(cx + 140, cy + 280, 40, -Math.PI / 2, -Math.PI / 2 + Math.PI * 1.4 * invEase);
        targetCtx.stroke();
      }

      // Silver dust motes floating in space
      targetCtx.fillStyle = PAL.silverDust;
      for (let p = 0; p < 35; p++) {
        const px = (rnd() * W + t * 20) % W;
        const py = (rnd() * H + t * 15) % H;
        targetCtx.fillRect(px, py, 2, 2);
      }

      targetCtx.restore();
    }

    // ----------------------------------------------------
    // BEAT 5: Tortillon Smudge & Outro Hanko Stamp (17.5s - 20.0s)
    // ----------------------------------------------------
    if (t >= 17.2) {
      const outroP = clamp((t - 17.5) / 2.2, 0, 1);
      const outEase = easeOutCubic(outroP);

      // Re-establish warm bone paper substrate
      targetCtx.save();
      targetCtx.fillStyle = PAL.paperBase;
      targetCtx.globalAlpha = outEase;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.drawImage(grainCanvas, 0, 0, W, H);
      targetCtx.restore();

      // Tortillon Smudge Sweep Trail
      if (outroP < 0.7) {
        const sweepX = W * (outroP / 0.7);
        targetCtx.save();
        targetCtx.fillStyle = 'rgba(74, 71, 67, 0.08)';
        targetCtx.filter = 'blur(12px)';
        targetCtx.fillRect(sweepX - 180, 0, 360, H);
        targetCtx.restore();
      }

      // Final Centerpiece Reveal
      targetCtx.save();
      targetCtx.textAlign = 'center';

      // Title
      targetCtx.fillStyle = PAL.pencil8B;
      targetCtx.font = 'italic 700 88px "Instrument Serif", Georgia, serif';
      targetCtx.fillText('H O R I Z O N S', W / 2, 420);

      // Subtitle
      targetCtx.font = '400 16px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.pencil4B;
      targetCtx.letterSpacing = '0.35em';
      targetCtx.fillText('A SLOW TRAVEL MONOGRAPH & LIVING GUIDE', W / 2, 475);

      // Live GitHub Pages URL (Hero Call to Action)
      targetCtx.font = '600 24px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.pencil8B;
      targetCtx.fillText('rahul-gembali.github.io/travel-template/', W / 2, 570);

      // Underline highlight
      targetCtx.strokeStyle = PAL.terracottaHanko;
      targetCtx.lineWidth = 2.5;
      targetCtx.beginPath();
      const urlWidth = 620;
      targetCtx.moveTo(W / 2 - urlWidth / 2, 595);
      targetCtx.lineTo(W / 2 - urlWidth / 2 + urlWidth * clamp(outroP * 1.4, 0, 1), 595);
      targetCtx.stroke();

      // Category tags
      targetCtx.font = '500 13px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.ochreAccent;
      targetCtx.fillText('KYOTO · OAXACA · TBILISI · LISBON · CAPE TOWN · BERGEN', W / 2, 650);

      // Vermillion Artist Seal (Hanko — #C26D53)
      if (outroP > 0.4) {
        const hankoP = (outroP - 0.4) / 0.6;
        const hankoScale = 1.0 + (1 - easeOutCubic(hankoP)) * 0.4;
        const hx = W / 2 + 360;
        const hy = 420;

        targetCtx.save();
        targetCtx.translate(hx, hy);
        targetCtx.scale(hankoScale, hankoScale);
        targetCtx.globalAlpha = clamp(hankoP * 2, 0, 0.95);

        // Seal Border
        targetCtx.strokeStyle = PAL.terracottaHanko;
        targetCtx.lineWidth = 4.0;
        targetCtx.strokeRect(-45, -45, 90, 90);

        // Carved Kanji characters inside seal
        targetCtx.fillStyle = PAL.terracottaHanko;
        targetCtx.font = '700 36px serif';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText('視野', 0, 0);

        targetCtx.restore();
      }

      targetCtx.restore();
    }

    targetCtx.restore(); // Restore camera drift
  }

  // ==========================================
  // OFFLINE FRAME API (for Puppeteer / render.mjs)
  // ==========================================
  window.__frame = function(i) {
    renderFrame(ctx, i);
    return canvas.toDataURL('image/png');
  };

  // ==========================================
  // PROCEDURAL ASMR AUDIO SYNTHESIS (WAV EXPORT)
  // Generates 20.0s 44.1kHz 16-bit Mono PCM WAV
  // ==========================================
  window.__wav = function() {
    const sampleRate = 44100;
    const numSamples = Math.floor(sampleRate * DURATION);
    const buffer = new ArrayBuffer(44 + numSamples * 2);
    const view = new DataView(buffer);

    // Write RIFF header
    function writeString(offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + numSamples * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);        // SubChunk1Size (16 for PCM)
    view.setUint16(20, 1, true);         // AudioFormat (1 = PCM)
    view.setUint16(22, 1, true);         // NumChannels (1 = Mono)
    view.setUint32(24, sampleRate, true);// SampleRate
    view.setUint32(28, sampleRate * 2, true); // ByteRate
    view.setUint16(32, 2, true);         // BlockAlign
    view.setUint16(34, 16, true);        // BitsPerSample
    writeString(36, 'data');
    view.setUint32(40, numSamples * 2, true);

    // Audio DSP variables
    let b0 = 0, b1 = 0, b2 = 0; // Pink noise state
    let woodEnv1 = 0, woodEnv2 = 0;

    for (let i = 0; i < numSamples; i++) {
      const curTime = i / sampleRate;
      let sample = 0;

      // 1. Pink Noise Paper Tooth Body
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      const pink = (b0 + b1 + b2 + white * 0.5362) * 0.035;
      sample += pink * 0.25;

      // 2. 2H Lead Glide (0.0s - 3.5s)
      if (curTime < 3.5) {
        const scratch = (Math.random() * 2 - 1) * Math.sin(curTime * 2800 * Math.PI * 2);
        const env = Math.sin((curTime / 3.5) * Math.PI);
        sample += scratch * env * 0.06;
      }

      // 3. 4B Cross-Hatch Scraping (3.5s - 7.5s)
      if (curTime >= 3.5 && curTime < 7.5) {
        const scrapeFreq = 800 + Math.sin(curTime * 12) * 300;
        const scrape = (Math.random() * 2 - 1) * Math.sin(curTime * scrapeFreq * Math.PI * 2);
        sample += scrape * 0.09;
      }

      // 4. Cedarwood Pencil Tap at 4.8s
      if (curTime >= 4.8 && curTime < 5.0) {
        const tapT = curTime - 4.8;
        const tapWave = Math.sin(tapT * 2400 * Math.PI * 2) * Math.exp(-tapT * 45);
        sample += tapWave * 0.35;
      }

      // 5. Hand-drawn strokes (7.5s - 14.5s)
      if (curTime >= 7.5 && curTime < 14.5) {
        const strokeEnv = Math.max(0, Math.sin(curTime * 6));
        const strokeNoise = (Math.random() * 2 - 1) * 0.07 * strokeEnv;
        sample += strokeNoise;
      }

      // 6. Dynamic Inversion 45Hz Sub-Bass Impact (14.5s)
      if (curTime >= 14.5 && curTime < 17.5) {
        const subT = curTime - 14.5;
        const subSine = Math.sin(subT * 45 * Math.PI * 2) * Math.exp(-subT * 1.5);
        const rumble = (Math.random() * 2 - 1) * 0.04 * Math.exp(-subT * 2.0);
        sample += (subSine * 0.45 + rumble);
      }

      // 7. Tortillon Smudge Whisper (17.5s - 19.2s)
      if (curTime >= 17.5 && curTime < 19.2) {
        const smudgeT = curTime - 17.5;
        const smudgeNoise = (Math.random() * 2 - 1) * 0.08 * Math.sin((smudgeT / 1.7) * Math.PI);
        sample += smudgeNoise;
      }

      // 8. Final Hanko Seal Stamp Tap at 19.2s
      if (curTime >= 19.2 && curTime < 19.5) {
        const tapT = curTime - 19.2;
        const stampWave = Math.sin(tapT * 1800 * Math.PI * 2) * Math.exp(-tapT * 50);
        sample += stampWave * 0.4;
      }

      // Clamp to 16-bit PCM
      sample = Math.max(-1, Math.min(1, sample));
      view.setInt16(44 + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
    }

    // Convert to base64
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const len = bytes.byteLength;
    for (let i = 0; i < len; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  };

  // ==========================================
  // IN-BROWSER INTERACTIVE PLAYER
  // ==========================================
  let currentFrame = 0;
  let isPlaying = false;
  let animId = null;
  let lastTime = 0;

  const playBtn = document.getElementById('playBtn');
  const scrubber = document.getElementById('scrubber');
  const timeCode = document.getElementById('timeCode');

  function updateDisplay(f) {
    currentFrame = f;
    scrubber.value = f;
    const sec = Math.floor(f / FPS);
    const cent = Math.floor(((f % FPS) / FPS) * 100);
    timeCode.textContent = `${String(sec).padStart(2, '0')}:${String(cent).padStart(2, '0')} / 00:20 (FRAME ${String(f).padStart(3, '0')}/480)`;
    renderFrame(ctx, f);
  }

  function tick(now) {
    if (!isPlaying) return;
    if (!lastTime) lastTime = now;
    const elapsed = (now - lastTime) / 1000;
    if (elapsed >= 1 / FPS) {
      currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      updateDisplay(currentFrame);
      lastTime = now;
    }
    animId = requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    playBtn.textContent = isPlaying ? 'PAUSE' : 'PLAY';
    if (isPlaying) {
      lastTime = 0;
      animId = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(animId);
    }
  });

  scrubber.addEventListener('input', (e) => {
    if (isPlaying) {
      isPlaying = false;
      playBtn.textContent = 'PLAY';
      cancelAnimationFrame(animId);
    }
    updateDisplay(parseInt(e.target.value, 10));
  });

  // Initial draw
  updateDisplay(0);
  </script>
</body>
</html>
