<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HORIZONS — Hand-Drawn Graphite Launch Film</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141312;
      color: #E8E3D7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }
    #wrapper {
      position: relative;
      width: min(96vw, 1280px);
      aspect-ratio: 16 / 9;
      background: #0D0D0E;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
      border-radius: 6px;
      overflow: hidden;
    }
    canvas#mainCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      width: min(96vw, 1280px);
      background: #1E1D1B;
      padding: 12px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }
    button {
      background: #2C2A28;
      color: #F5F2EB;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #3A3835;
      border-color: rgba(255,255,255,0.3);
    }
    input[type=range] {
      flex: 1;
      accent-color: #C26D53;
      cursor: pointer;
    }
    .telemetry {
      font-family: "JetBrains Mono", monospace;
      color: #A09B90;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <canvas id="mainCanvas" width="1920" height="1080"></canvas>
  </div>

  <div class="controls">
    <button id="playBtn">PLAY</button>
    <input type="range" id="scrubber" min="0" max="479" value="0">
    <span class="telemetry" id="timeCode">00:00 / 00:20 (FRAME 000/480)</span>
  </div>

  <script>
  'use strict';

  const W = 1920;
  const H = 1080;
  const FPS = 24;
  const TOTAL_FRAMES = 480; // 20.0 seconds
  const DURATION = TOTAL_FRAMES / FPS;

  window.__NDRAW = TOTAL_FRAMES;
  window.__fps = FPS;
  window.__size = { w: W, h: H };
  window.__ready = false;

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  // Palette Definitions
  const PAL = {
    paperBase: '#F5F2EB',       // 640gsm Cold-Press Cotton Rag
    paperShadow: '#E8E3D7',     // Fiber density shading
    draftGrid: 'rgba(213, 207, 194, 0.45)', // 2H faint technical grid
    pencil2H: 'rgba(74, 71, 67, 0.28)',    // 2H contour whisper
    pencil4B: '#4A4743',        // 4B flat midtone
    pencil8B: '#1A1918',        // 8B greasy velvet carbon mass
    slateAbyss: '#0D0D0E',      // Obsidian slate
    silverDust: '#7E8084',      // Crushed graphite haze
    chalkHighlight: '#E8EAED',  // Luminous white chalk
    terracottaHanko: '#C26D53', // Vermillion artist seal
    ochreAccent: '#B5884B'      // Warm architectural ochre
  };

  // Pre-generate static paper grain texture
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 512;
  grainCanvas.height = 512;
  const gctx = grainCanvas.getContext('2d');
  const imgData = gctx.createImageData(512, 512);
  const data = imgData.data;
  let seed = 42;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  for (let i = 0; i < data.length; i += 4) {
    const v = 245 + (rnd() * 10 - 5);
    const noise = (rnd() - 0.5) * 16;
    data[i] = Math.min(255, Math.max(0, v + noise));
    data[i+1] = Math.min(255, Math.max(0, v - 3 + noise));
    data[i+2] = Math.min(255, Math.max(0, v - 10 + noise));
    data[i+3] = 255;
  }
  gctx.putImageData(imgData, 0, 0);

  // Math & Easing Helpers
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return (--t) * t * t + 1; }
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
  function springSettle(t, stiffness = 120, damping = 14) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const omega = Math.sqrt(stiffness);
    return 1 - Math.exp(-damping * t * 0.5) * Math.cos(omega * t);
  }

  // Preload Master Artwork Assets
  const images = {};
  const assetNames = ['hero', 'kyoto', 'oaxaca', 'bergen'];
  let loadedAssets = 0;

  assetNames.forEach(name => {
    const img = new Image();
    img.src = 'assets/' + name + '.jpg';
    img.onload = () => {
      images[name] = img;
      loadedAssets++;
      if (loadedAssets === assetNames.length) {
        window.__ready = true;
        updateDisplay(0);
      }
    };
    img.onerror = () => {
      console.warn('Could not load asset: assets/' + name + '.jpg');
      loadedAssets++;
      if (loadedAssets === assetNames.length) {
        window.__ready = true;
        updateDisplay(0);
      }
    };
  });

  // ==========================================
  // MASTER RENDER SCENE FUNCTION
  // ==========================================
  function renderFrame(targetCtx, frameIndex) {
    const t = frameIndex / FPS;
    seed = (frameIndex * 997 + 101) % 2147483647;

    // Background paper substrate
    targetCtx.fillStyle = PAL.paperBase;
    targetCtx.fillRect(0, 0, W, H);
    targetCtx.drawImage(grainCanvas, 0, 0, W, H);

    // Camera Drift (Subtle Steadicam float)
    targetCtx.save();
    const camDriftX = Math.sin(t * 0.35) * 6;
    const camDriftY = Math.cos(t * 0.25) * 5;
    const camScale = 1.0 + Math.sin(t * 0.2) * 0.012;
    targetCtx.translate(W / 2, H / 2);
    targetCtx.scale(camScale, camScale);
    targetCtx.translate(-W / 2 + camDriftX, -H / 2 + camDriftY);

    // ----------------------------------------------------
    // BEAT 1: The Blank Sheet & 2H Contour Wireframe (0.0s - 3.5s)
    // ----------------------------------------------------
    if (t < 3.8) {
      const b1 = clamp(t / 3.2, 0, 1);
      const ease1 = easeOutCubic(b1);

      // Faint 2H Technical Drafting Grid
      targetCtx.strokeStyle = PAL.draftGrid;
      targetCtx.lineWidth = 1;
      const gridSize = 60;
      targetCtx.beginPath();
      for (let x = 0; x < W; x += gridSize) {
        targetCtx.moveTo(x, 0); targetCtx.lineTo(x, H);
      }
      for (let y = 0; y < H; y += gridSize) {
        targetCtx.moveTo(0, y); targetCtx.lineTo(W, y);
      }
      targetCtx.stroke();

      // Technical Telemetry Annotations
      targetCtx.fillStyle = 'rgba(74, 71, 67, 0.45)';
      targetCtx.font = '12px "JetBrains Mono", monospace';
      targetCtx.fillText('FIG. 01 — ARCHITECTURAL ARCH / LAT. 35.0116° N / 640GSM COTTON RAG', 90, 80);
      targetCtx.fillText('SCALE: 1:1 MONOGRAPH / DRAWING PASS: 2H CONTOUR', 90, 102);

      // Render Hero Architectural Artwork with progressive sketch mask
      if (images.hero) {
        targetCtx.save();
        const heroSize = 520;
        const hx = W / 2 - heroSize / 2;
        const hy = 260;

        // Clip revealing from bottom-to-top with curved arch
        targetCtx.beginPath();
        targetCtx.rect(hx, hy + heroSize * (1 - ease1), heroSize, heroSize * ease1);
        targetCtx.clip();

        targetCtx.globalAlpha = 0.35 + ease1 * 0.65;
        targetCtx.drawImage(images.hero, hx, hy, heroSize, heroSize);
        targetCtx.restore();
      }
    }

    // ----------------------------------------------------
    // BEAT 2: 4B Cross-Hatching & Volumetric Hero Reveal (3.5s - 7.5s)
    // ----------------------------------------------------
    if (t >= 3.2 && t < 7.8) {
      const b2 = clamp((t - 3.5) / 3.8, 0, 1);
      const ease2 = easeOutCubic(b2);

      if (images.hero) {
        targetCtx.save();
        const heroSize = 540 + ease2 * 20;
        const hx = W / 2 - heroSize / 2;
        const hy = 220;

        // Soft organic paper shadow (no hard stroke border)
        targetCtx.shadowColor = 'rgba(26, 25, 24, 0.08)';
        targetCtx.shadowBlur = 24;
        targetCtx.shadowOffsetY = 10;
        targetCtx.drawImage(images.hero, hx, hy, heroSize, heroSize);
        targetCtx.restore();
      }

      // Display Typography Rub-Down: HORIZONS
      if (t >= 4.2) {
        const typoP = clamp((t - 4.2) / 1.6, 0, 1);
        const springVal = springSettle(typoP, 140, 16);
        const typoY = 860 - (1 - springVal) * 20;

        targetCtx.save();
        targetCtx.textAlign = 'center';
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.globalAlpha = clamp(typoP * 1.5, 0, 1);

        // Editorial Serif Title
        targetCtx.font = 'italic 700 82px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('H O R I Z O N S', W / 2, typoY);

        // Subtitle
        targetCtx.font = '400 15px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.letterSpacing = '0.35em';
        targetCtx.fillText('WHERE STILLNESS MEETS THE HORIZON', W / 2, typoY + 48);

        // Badges
        if (typoP > 0.5) {
          targetCtx.font = '500 12px "JetBrains Mono", monospace';
          targetCtx.fillStyle = PAL.ochreAccent;
          targetCtx.fillText('MINDFUL STAYS · LIVING MONOGRAPHS · SLOW TIME', W / 2, typoY + 80);
        }
        targetCtx.restore();
      }
    }

    // ----------------------------------------------------
    // BEAT 3: Hand-Drawn Journey across 3 Masterpieces (7.5s - 14.6s)
    // Smooth cross-fading without any artificial rectangular border
    // ----------------------------------------------------
    if (t >= 7.3 && t < 14.8) {
      targetCtx.save();

      // Common dimensions for the 3 master artworks
      const aw = 1120;
      const ah = 630;
      const ax = 120;
      const ay = 250;

      // 1. KYOTO: active 7.5s to 9.9s (fade in 7.5-7.9s, hold 7.9-9.5s, fade out 9.5-9.9s)
      let kyotoAlpha = 0;
      if (t >= 7.5 && t < 9.5) {
        kyotoAlpha = clamp((t - 7.5) / 0.4, 0, 1);
      } else if (t >= 9.5 && t < 9.9) {
        kyotoAlpha = 1 - clamp((t - 9.5) / 0.4, 0, 1);
      }

      if (kyotoAlpha > 0) {
        const kEase = easeOutCubic(clamp((t - 7.5) / 1.8, 0, 1));
        const curY = ay - (1 - kEase) * 15;

        targetCtx.save();
        targetCtx.globalAlpha = kyotoAlpha;

        if (images.kyoto) {
          targetCtx.shadowColor = 'rgba(26, 25, 24, 0.08)';
          targetCtx.shadowBlur = 24;
          targetCtx.shadowOffsetY = 10;
          targetCtx.drawImage(images.kyoto, ax, curY, aw, ah);
          targetCtx.shadowColor = 'transparent';
        }

        // Typography
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 700 58px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('京都 · KYOTO', 1300, 420);

        targetCtx.font = '500 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('CITADELS OF MINDFUL STILLNESS', 1300, 470);
        targetCtx.fillText('CEDAR MACHIYA & MOSS TEMPLES', 1300, 495);

        // Kanji Stamp
        targetCtx.fillStyle = PAL.terracottaHanko;
        targetCtx.font = '700 72px serif';
        targetCtx.fillText('静', 1300, 620);
        targetCtx.font = '12px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('[ SEI — SACRED QUIETUDE ]', 1300, 660);

        targetCtx.restore();
      }

      // 2. OAXACA: active 9.6s to 12.2s (fade in 9.6-10.0s, hold 10.0-11.8s, fade out 11.8-12.2s)
      let oaxacaAlpha = 0;
      if (t >= 9.6 && t < 11.8) {
        oaxacaAlpha = clamp((t - 9.6) / 0.4, 0, 1);
      } else if (t >= 11.8 && t < 12.2) {
        oaxacaAlpha = 1 - clamp((t - 11.8) / 0.4, 0, 1);
      }

      if (oaxacaAlpha > 0) {
        const oEase = easeOutCubic(clamp((t - 9.8) / 1.8, 0, 1));
        const curY = ay - (1 - oEase) * 15;

        targetCtx.save();
        targetCtx.globalAlpha = oaxacaAlpha;

        if (images.oaxaca) {
          targetCtx.shadowColor = 'rgba(26, 25, 24, 0.08)';
          targetCtx.shadowBlur = 24;
          targetCtx.shadowOffsetY = 10;
          targetCtx.drawImage(images.oaxaca, ax, curY, aw, ah);
          targetCtx.shadowColor = 'transparent';
        }

        // Typography
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 700 58px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('OAXACA DE JUÁREZ', 1300, 420);

        targetCtx.font = '500 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('EARTHEN SMOKE & COPAL RESIN', 1300, 470);
        targetCtx.fillText('ARTISAN STONE & CLAY GUILDS', 1300, 495);

        targetCtx.font = '13px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.terracottaHanko;
        targetCtx.fillText('SPECIMEN: AGAVE POTATORUM', 1300, 610);
        targetCtx.fillText('KILN FIRING: 980°C / RED EARTH', 1300, 635);

        targetCtx.restore();
      }

      // 3. BERGEN: active 11.9s to 14.6s (fade in 11.9-12.3s, hold 12.3-14.2s, fade out 14.2-14.6s)
      let bergenAlpha = 0;
      if (t >= 11.9 && t < 14.2) {
        bergenAlpha = clamp((t - 11.9) / 0.4, 0, 1);
      } else if (t >= 14.2 && t < 14.6) {
        bergenAlpha = 1 - clamp((t - 14.2) / 0.4, 0, 1);
      }

      if (bergenAlpha > 0) {
        const bEase = easeOutCubic(clamp((t - 12.1) / 1.8, 0, 1));
        const curY = ay - (1 - bEase) * 15;

        targetCtx.save();
        targetCtx.globalAlpha = bergenAlpha;

        if (images.bergen) {
          targetCtx.shadowColor = 'rgba(26, 25, 24, 0.08)';
          targetCtx.shadowBlur = 24;
          targetCtx.shadowOffsetY = 10;
          targetCtx.drawImage(images.bergen, ax, curY, aw, ah);
          targetCtx.shadowColor = 'transparent';
        }

        // Typography
        targetCtx.fillStyle = PAL.pencil8B;
        targetCtx.font = 'italic 700 58px "Instrument Serif", Georgia, serif';
        targetCtx.fillText('BERGEN · FJORD MIST', 1300, 420);

        targetCtx.font = '500 14px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.pencil4B;
        targetCtx.fillText('HANSEATIC TIMBER WHARF', 1300, 470);
        targetCtx.fillText('MARITIME RAIN & PINE RIDGES', 1300, 495);

        targetCtx.font = '13px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.ochreAccent;
        targetCtx.fillText('LAT. 60.3929° N / 5.3241° E', 1300, 610);
        targetCtx.fillText('PRECIPITATION: 240 DAYS / SLOW FOG', 1300, 635);

        targetCtx.restore();
      }

      targetCtx.restore();
    }

    // ----------------------------------------------------
    // BEAT 4: Dynamic Slate Inversion (14.5s - 17.5s)
    // ----------------------------------------------------
    if (t >= 14.3 && t < 17.8) {
      const invP = clamp((t - 14.5) / 2.5, 0, 1);
      const invEase = easeInOutCubic(invP);

      // Inversion Wipe / Expanding Charcoal Blot
      const blotRadius = invEase * Math.hypot(W, H);
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.arc(W / 2, H / 2, blotRadius, 0, Math.PI * 2);
      targetCtx.fillStyle = PAL.slateAbyss;
      targetCtx.fill();
      targetCtx.clip();

      // Inside Slate Inversion: Silver Dust & Luminous Chalk
      targetCtx.fillStyle = PAL.chalkHighlight;
      targetCtx.font = 'italic 700 76px "Instrument Serif", Georgia, serif';
      targetCtx.textAlign = 'center';
      targetCtx.fillText('THE LIVING MONOGRAPH', W / 2, 260);

      targetCtx.font = '500 15px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.silverDust;
      targetCtx.fillText('REAL-TIME WEATHER GAUGES · CURATED RETREATS · 6 GLOBAL CITADELS', W / 2, 315);

      // Bento Telemetry Cards (Minimalist-UI + Neo-Minimal 3D Hybrid)
      const cards = [
        { city: 'KYOTO', temp: '18°C', desc: 'MOSS RAIN', pace: '0.4x', note: 'Zazen Morning' },
        { city: 'OAXACA', temp: '24°C', desc: 'COPAL EMBERS', pace: '0.5x', note: 'Clay Guild' },
        { city: 'BERGEN', temp: '14°C', desc: 'FJORD MIST', pace: '0.3x', note: 'Pine Sauna' }
      ];

      for (let ci = 0; ci < cards.length; ci++) {
        const cx = W / 2 - 480 + ci * 330;
        const cy = 400;
        const c = cards[ci];

        targetCtx.strokeStyle = 'rgba(255,255,255,0.12)';
        targetCtx.lineWidth = 1;
        targetCtx.strokeRect(cx, cy, 300, 390);

        targetCtx.textAlign = 'left';
        targetCtx.font = '600 22px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.chalkHighlight;
        targetCtx.fillText(c.city, cx + 28, cy + 54);

        targetCtx.font = '300 52px "Instrument Serif", Georgia, serif';
        targetCtx.fillText(c.temp, cx + 28, cy + 130);

        targetCtx.font = '400 13px "JetBrains Mono", monospace';
        targetCtx.fillStyle = PAL.silverDust;
        targetCtx.fillText('ATMOSPHERE: ' + c.desc, cx + 28, cy + 185);
        targetCtx.fillText('TEMPO: ' + c.pace, cx + 28, cy + 215);
        targetCtx.fillText('RECOMMENDED: ' + c.note, cx + 28, cy + 245);

        // Circular Dial
        targetCtx.strokeStyle = PAL.terracottaHanko;
        targetCtx.lineWidth = 2.5;
        targetCtx.beginPath();
        targetCtx.arc(cx + 150, cy + 320, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 1.5 * invEase);
        targetCtx.stroke();
      }

      // Silver dust motes
      targetCtx.fillStyle = PAL.silverDust;
      for (let p = 0; p < 40; p++) {
        const px = (rnd() * W + t * 25) % W;
        const py = (rnd() * H + t * 18) % H;
        targetCtx.fillRect(px, py, 2, 2);
      }

      targetCtx.restore();
    }

    // ----------------------------------------------------
    // BEAT 5: Tortillon Smudge & Outro Hanko Stamp (17.5s - 20.0s)
    // ----------------------------------------------------
    if (t >= 17.2) {
      const outroP = clamp((t - 17.5) / 2.2, 0, 1);
      const outEase = easeOutCubic(outroP);

      // Warm bone paper substrate
      targetCtx.save();
      targetCtx.fillStyle = PAL.paperBase;
      targetCtx.globalAlpha = outEase;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.drawImage(grainCanvas, 0, 0, W, H);
      targetCtx.restore();

      // Tortillon Smudge Sweep Trail
      if (outroP < 0.7) {
        const sweepX = W * (outroP / 0.7);
        targetCtx.save();
        targetCtx.fillStyle = 'rgba(74, 71, 67, 0.08)';
        targetCtx.filter = 'blur(12px)';
        targetCtx.fillRect(sweepX - 180, 0, 360, H);
        targetCtx.restore();
      }

      // Final Centerpiece Reveal
      targetCtx.save();
      targetCtx.textAlign = 'center';

      // Title
      targetCtx.fillStyle = PAL.pencil8B;
      targetCtx.font = 'italic 700 88px "Instrument Serif", Georgia, serif';
      targetCtx.fillText('H O R I Z O N S', W / 2, 420);

      // Subtitle
      targetCtx.font = '400 16px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.pencil4B;
      targetCtx.letterSpacing = '0.35em';
      targetCtx.fillText('A SLOW TRAVEL MONOGRAPH & LIVING GUIDE', W / 2, 475);

      // Live GitHub Pages URL (Hero Call to Action)
      targetCtx.font = '600 24px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.pencil8B;
      targetCtx.fillText('rahul-gembali.github.io/travel-template/', W / 2, 570);

      // Underline highlight
      targetCtx.strokeStyle = PAL.terracottaHanko;
      targetCtx.lineWidth = 2.5;
      targetCtx.beginPath();
      const urlWidth = 620;
      targetCtx.moveTo(W / 2 - urlWidth / 2, 595);
      targetCtx.lineTo(W / 2 - urlWidth / 2 + urlWidth * clamp(outroP * 1.4, 0, 1), 595);
      targetCtx.stroke();

      // Category tags
      targetCtx.font = '500 13px "JetBrains Mono", monospace';
      targetCtx.fillStyle = PAL.ochreAccent;
      targetCtx.fillText('KYOTO · OAXACA · TBILISI · LISBON · CAPE TOWN · BERGEN', W / 2, 650);

      // Vermillion Artist Seal (Hanko — #C26D53)
      if (outroP > 0.4) {
        const hankoP = (outroP - 0.4) / 0.6;
        const hankoScale = 1.0 + (1 - easeOutCubic(hankoP)) * 0.4;
        const hx = W / 2 + 360;
        const hy = 420;

        targetCtx.save();
        targetCtx.translate(hx, hy);
        targetCtx.scale(hankoScale, hankoScale);
        targetCtx.globalAlpha = clamp(hankoP * 2, 0, 0.95);

        // Seal Border
        targetCtx.strokeStyle = PAL.terracottaHanko;
        targetCtx.lineWidth = 4.0;
        targetCtx.strokeRect(-45, -45, 90, 90);

        // Carved Kanji characters inside seal
        targetCtx.fillStyle = PAL.terracottaHanko;
        targetCtx.font = '700 36px serif';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText('視野', 0, 0);

        targetCtx.restore();
      }

      targetCtx.restore();
    }

    targetCtx.restore(); // Restore camera drift
  }

  // ==========================================
  // OFFLINE FRAME API (for Puppeteer / render.mjs)
  // ==========================================
  window.__frame = function(i) {
    renderFrame(ctx, i);
    return canvas.toDataURL('image/png');
  };

  // ==========================================
  // IN-BROWSER INTERACTIVE PLAYER
  // ==========================================
  let currentFrame = 0;
  let isPlaying = false;
  let animId = null;
  let lastTime = 0;

  const playBtn = document.getElementById('playBtn');
  const scrubber = document.getElementById('scrubber');
  const timeCode = document.getElementById('timeCode');

  function updateDisplay(f) {
    currentFrame = f;
    scrubber.value = f;
    const sec = Math.floor(f / FPS);
    const cent = Math.floor(((f % FPS) / FPS) * 100);
    timeCode.textContent = `${String(sec).padStart(2, '0')}:${String(cent).padStart(2, '0')} / 00:20 (FRAME ${String(f).padStart(3, '0')}/480)`;
    renderFrame(ctx, f);
  }

  function tick(now) {
    if (!isPlaying) return;
    if (!lastTime) lastTime = now;
    const elapsed = (now - lastTime) / 1000;
    if (elapsed >= 1 / FPS) {
      currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      updateDisplay(currentFrame);
      lastTime = now;
    }
    animId = requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    playBtn.textContent = isPlaying ? 'PAUSE' : 'PLAY';
    if (isPlaying) {
      lastTime = 0;
      animId = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(animId);
    }
  });

  scrubber.addEventListener('input', (e) => {
    if (isPlaying) {
      isPlaying = false;
      playBtn.textContent = 'PLAY';
      cancelAnimationFrame(animId);
    }
    updateDisplay(parseInt(e.target.value, 10));
  });
  </script>
</body>
</html>
